<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Agentic Studio · móvil</title><link rel="stylesheet" href="/mobile.css"></head><body><header><b>b· Agentic Studio</b><span>Tu Mac · red local</span></header><main><h2 id="project">Conectando…</h2><p id="permissions"></p><div class="controls"><select id="session" aria-label="Conversación"></select><button id="new">Nueva</button><button id="refresh">Actualizar</button></div><div class="controls"><select id="provider" aria-label="Proveedor"></select><select id="model" aria-label="Modelo"></select></div><p id="status" role="status"></p><section id="messages"></section><details open><summary>Acciones y permisos del agente</summary><div id="actions"></div><button id="resume">Continuar agente</button></details><details><summary>Actividad en directo</summary><pre id="activity"></pre></details><form id="compose"><textarea id="prompt" placeholder="Escribe al modelo del Mac…" rows="3" required></textarea><label><input id="agent" type="checkbox"> Modo agente</label><button id="send">Enviar</button></form><p class="note">Los modelos y herramientas se ejecutan en el Mac. Esta vinculación solo permite el proyecto indicado; la configuración global y el acceso a otros proyectos se gestionan en el Mac.</p></main><script src="/mobile.js"></script></body></html>
